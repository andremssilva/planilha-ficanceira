<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Mensal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; overflow: hidden; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        
        .bg-dark-green { background-color: #3b7342; }
        .text-dark-green { color: #3b7342; }
        .border-dark-green { border-color: #3b7342; }
        .bg-light-green { background-color: #c9dec9; }
        .row-alt:nth-child(even) { background-color: #f1f8f1; }
        .row-alt:nth-child(odd) { background-color: #ffffff; }

        .main-scroll-area { height: calc(100vh - 180px); overflow-y: auto; padding: 1.5rem; }
        
        .spreadsheet-table { width: 100%; border-collapse: collapse; border: 1px solid #d1d5db; }
        .spreadsheet-table th, .spreadsheet-table td { padding: 8px 12px; text-align: left; border: 1px solid #e5e7eb; font-size: 0.85rem; }
        .spreadsheet-table th { background-color: #3b7342; color: #ffffff; font-weight: 600; text-align: center; }
        .spreadsheet-table td { text-align: center; }
        .spreadsheet-table td.text-left { text-align: left; }
        .spreadsheet-table tbody tr:hover { background-color: #e5e7eb; cursor: pointer; transition: background-color 0.2s; }

        .badge-status { padding: 4px 12px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; border: 1px solid #ccc; display: inline-block; min-width: 80px;}
        .badge-paid { background-color: #c9dec9; color: #166534; }
        .badge-unpaid { background-color: #fef2f2; color: #b91c1c; }
        .badge-type { background-color: #fef2f2; color: #b91c1c; padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; border: 1px solid #fecaca;}
        .badge-category { background-color: #e5e7eb; color: #374151; padding: 4px 10px; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 4px;}

        .filter-btn { padding: 6px 14px; font-size: 0.8rem; border-radius: 6px; transition: all 0.2s; font-weight: 600; }
        .filter-btn.active { background-color: #3b7342; color: white; box-shadow: 0 2px 4px rgba(14, 165, 233, 0.2); }
        .filter-btn:not(.active) { background-color: #e2e8f0; color: #475569; }
        .filter-btn:not(.active):hover { background-color: #cbd5e1; }
        
        .form-input { width: 100%; padding: 0.5rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        
        .main-scroll-area::-webkit-scrollbar { width: 8px; }
        .main-scroll-area::-webkit-scrollbar-track { background: #f1f5f9; }
        .main-scroll-area::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }

        .action-btn { padding: 4px; border-radius: 4px; transition: all 0.2s; color: #64748b; }
        .action-btn:hover { background-color: #e2e8f0; color: #0f172a; }
        .action-btn-danger:hover { background-color: #fee2e2; color: #e11d48; }

        /* Barra de Progresso do Orçamento */
        .progress-bar-bg { width: 100%; background-color: #e5e7eb; border-radius: 9999px; height: 8px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; border-radius: 9999px; transition: width 0.5s ease-in-out; }
        .progress-safe { background-color: #3b7342; }
        .progress-warn { background-color: #eab308; }
        .progress-danger { background-color: #ef4444; }
    </style>
</head>
<body class="text-slate-800">

    <input type="file" id="csv-file-input" accept=".csv" class="hidden">

    <div class="max-w-7xl mx-auto w-full h-screen flex flex-col bg-white shadow-2xl relative border-x border-slate-300">

        <!-- CABEÇALHO DE CONTROLES -->
        <header class="bg-white px-6 py-3 border-b border-slate-200 flex justify-between items-center shrink-0 shadow-sm z-20">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl font-bold text-dark-green tracking-tight mr-4">Controle Financeiro Mensal</h1>
                <div class="flex bg-slate-100 rounded-lg p-1 border border-slate-200 shadow-inner">
                    <select id="select-month" class="bg-transparent font-bold text-slate-700 pl-2 pr-6 py-1 outline-none cursor-pointer appearance-none" onchange="changeDate()"></select>
                    <div class="w-px bg-slate-300 mx-1"></div>
                    <select id="select-year" class="bg-transparent font-bold text-slate-700 pl-2 pr-6 py-1 outline-none cursor-pointer appearance-none" onchange="changeDate()"></select>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- BARRA DE PESQUISA -->
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-2 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="search-input" onkeyup="handleSearch()" placeholder="Pesquisar despesa..." class="pl-8 pr-3 py-1.5 border border-slate-300 rounded-lg text-sm outline-none focus:border-dark-green focus:ring-1 focus:ring-dark-green transition w-48">
                </div>

                <div class="hidden md:flex bg-slate-100 p-1 rounded-lg gap-1">
                    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">Todas</button>
                    <button class="filter-btn" data-filter="upto14" onclick="setFilter('upto14')">Até dia 14</button>
                    <button class="filter-btn" data-filter="after14" onclick="setFilter('after14')">Após dia 14</button>
                    <div class="w-px bg-slate-300 mx-0.5"></div>
                    <button class="filter-btn" data-filter="installments" onclick="setFilter('installments')">Parceladas</button>
                </div>
                
                <label class="flex items-center gap-2 cursor-pointer bg-slate-50 px-3 py-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 transition select-none ml-2">
                    <input type="checkbox" id="toggle-hide-paid" class="h-4 w-4 text-emerald-600 rounded border-slate-300" onchange="render()">
                    <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">Ocultar Pagos</span>
                </label>
                
                <div class="h-8 w-px bg-slate-200 mx-1"></div>
                
                <button onclick="definirReceita()" class="text-dark-green border border-dark-green hover:bg-light-green px-3 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-1">
                    $ Receita
                </button>
                 <button onclick="toggleModal('modal-add')" class="bg-dark-green hover:opacity-90 text-white px-4 py-1.5 rounded-lg text-sm font-semibold shadow-sm transition">
                    + Nova Despesa
                </button>
                 <button onclick="toggleModal('modal-menu')" class="text-slate-500 hover:bg-slate-100 p-1.5 rounded-lg transition">
